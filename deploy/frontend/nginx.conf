# Single entry point: the React application, plus /api/ relayed to Django (same origin, so cookies and CSRF just work).
# TLS is expected to be terminated in front of this container (hosting platform, Traefik, Caddy…).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    # The assistant's voice questions need the microphone, for this origin only.
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # API and Django static files: never cached by nginx, private answers stay private.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Built files have a content hash in their name: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Template images, fonts and icons: one week.
    location ~* \.(webp|png|jpg|svg|woff2?|ttf|eot|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Client-side routes of the single page application.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri /index.html;
    }
}
