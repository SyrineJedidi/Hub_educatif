# Every push to main or to a feature branch, and every pull request towards main:
# Django tests on a MongoDB replica set, the React build, then the Docker stack end to end.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Django, MongoDB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      # Throwaway secret (the settings refuse to start without one) and the default local replica set.
      DJANGO_SECRET_KEY: ci-only-insecure-secret-key
      MONGODB_URI: mongodb://127.0.0.1:27019/?replicaSet=nexora
    steps:
      - uses: actions/checkout@v7

      # Transactions need a replica set, and a service container cannot pass arguments to mongod.
      - name: Start MongoDB (replica set nexora on 127.0.0.1:27019)
        run: |
          docker run -d --name mongo --network host mongo:7 --replSet nexora --port 27019 --bind_ip 127.0.0.1
          for _ in $(seq 1 60); do
            docker exec mongo mongosh --quiet --port 27019 --eval 'db.adminCommand({ping: 1}).ok' >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --port 27019 --eval \
            'rs.initiate({_id: "nexora", members: [{_id: 0, host: "127.0.0.1:27019"}]}).ok'
          for _ in $(seq 1 60); do
            primary=$(docker exec mongo mongosh --quiet --port 27019 --eval 'db.hello().isWritablePrimary' 2>/dev/null || true)
            [ "$primary" = true ] && exit 0
            sleep 1
          done
          docker logs mongo
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: python -m pip install -r requirements.lock

      - name: System checks
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests with coverage
        run: python -m coverage run --rcfile=../.coveragerc manage.py test --noinput

      - name: Coverage report
        run: |
          python -m coverage report --rcfile=../.coveragerc
          python -m coverage report --rcfile=../.coveragerc --format=markdown >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (React build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

  docker:
    name: Docker stack (build, start, smoke test)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Plain HTTP on localhost with every AI provider off: enough to prove that the images build,
      # Django migrates and reaches MongoDB, and nginx serves the application and relays /api/.
      - name: Write a CI-only deploy/.env.production
        run: |
          cat > deploy/.env.production <<'EOF'
          DJANGO_SECRET_KEY=ci-only-insecure-secret-key
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
          CSRF_TRUSTED_ORIGINS=http://localhost:8080
          FRONTEND_URL=http://localhost:8080
          DJANGO_BEHIND_PROXY=false
          DJANGO_SECURE_SSL_REDIRECT=false
          DJANGO_SECURE_COOKIES=false
          DJANGO_LOG_LEVEL=INFO
          GUNICORN_WORKERS=2
          MONGODB_URI=mongodb://mongo:27017/?replicaSet=nexora
          MONGODB_DATABASE=nexora_hub
          CELERY_BROKER_URL=redis://redis:6379/0
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          GEMINI_API_KEY=
          HF_TOKEN=
          OLLAMA_URL=
          OLLAMA_MODEL=
          ASSISTANT_LLM_PROVIDER=disabled
          WHISPER_PROVIDER=disabled
          GROQ_API_KEY=
          EOF

      - name: Build the images
        run: docker compose build

      - name: Start the stack and wait until every service is healthy
        run: docker compose up -d --wait --wait-timeout 300

      - name: Smoke test through nginx
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 http://localhost:8080/api/health/
          echo
          curl --fail --silent --show-error http://localhost:8080/ | grep '<div id="root"></div>'

      - name: Show the logs
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
